<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BONNYSINO Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap');
        
        :root {
            --gold: #FFD700;
            --gold-dark: #B8860B;
            --gold-light: #FFED4E;
        }
        
        body {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #2d2d2d 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        
        .bebas {
            font-family: 'Bebas Neue', cursive;
        }
        
        .gold-glow {
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }
        
        .card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--gold);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(0, 0, 0, 0.8) 100%);
            border: 1px solid var(--gold);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }
        
        .user-row {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.2s ease;
        }
        
        .user-row:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        
        .btn-gold {
            background: var(--gold);
            color: black;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-gold:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }
        
        .btn-danger {
            background: #dc2626;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-danger:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--gold);
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .container {
                padding: 0.5rem;
            }
            
            .grid {
                grid-template-columns: 1fr !important;
                gap: 1rem !important;
            }
            
            .card {
                margin: 0.5rem;
                padding: 1rem !important;
            }
            
            .stat-card {
                padding: 0.75rem !important;
            }
            
            h1 {
                font-size: 2rem !important;
            }
            
            h2 {
                font-size: 1.5rem !important;
            }
            
            h3 {
                font-size: 1.25rem !important;
            }
            
            /* Table adjustments */
            table {
                font-size: 0.875rem;
            }
            
            th, td {
                padding: 0.5rem 0.25rem !important;
            }
            
            /* Button adjustments */
            .btn-gold, .btn-danger {
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
            }
            
            /* Form adjustments */
            input, select, textarea {
                font-size: 16px; /* Prevents zoom on iOS */
            }
            
            /* Modal adjustments */
            .fixed > div {
                margin: 1rem;
                max-width: calc(100% - 2rem);
                max-height: 90vh;
                overflow-y: auto;
            }
        }
        
        @media (max-width: 480px) {
            /* Extra small mobile adjustments */
            h1 {
                font-size: 1.5rem !important;
            }
            
            h2 {
                font-size: 1.25rem !important;
            }
            
            .card {
                margin: 0.25rem;
                padding: 0.75rem !important;
            }
            
            .stat-card {
                padding: 0.5rem !important;
            }
            
            /* Stack stat cards vertically */
            .grid.grid-cols-1.md\\:grid-cols-2.lg\\:grid-cols-4 {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 0.5rem !important;
            }
            
            /* Hide some table columns on very small screens */
            .table th:nth-child(3),
            .table td:nth-child(3) {
                display: none;
            }
            
            /* Button text adjustments */
            button span {
                display: none;
            }
            
            /* Compact table */
            .user-row {
                padding: 0.25rem;
            }
            
            /* Make buttons full width on small screens */
            .flex.gap-2 {
                flex-direction: column;
            }
            
            .flex.gap-2 button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="card p-8 max-w-md w-full mx-4">
            <h2 class="text-3xl font-bold text-yellow-400 mb-6 text-center bebas">ADMIN LOGIN</h2>
            
            <form id="adminLoginForm">
                <div class="mb-4">
                    <label class="block text-yellow-300 mb-2">Admin Username</label>
                    <input type="text" id="adminUsername" required
                           class="w-full px-4 py-3 bg-black border border-yellow-400 rounded-lg text-white focus:outline-none focus:border-yellow-300">
                </div>
                
                <div class="mb-6">
                    <label class="block text-yellow-300 mb-2">Admin Password</label>
                    <input type="password" id="adminPassword" required
                           class="w-full px-4 py-3 bg-black border border-yellow-400 rounded-lg text-white focus:outline-none focus:border-yellow-300">
                </div>
                
                <button type="submit" class="w-full btn-gold py-3 rounded-lg">
                    <i class="fas fa-sign-in-alt mr-2"></i>LOGIN
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard (Hidden until login) -->
    <div id="adminDashboard" class="hidden">
        <!-- Header -->
        <header class="bg-black border-b-2 border-yellow-400 py-6">
            <div class="container mx-auto px-6">
                <div class="flex justify-between items-center">
                    <div class="flex items-center">
                        <i class="fas fa-crown text-4xl text-yellow-400 mr-4 gold-glow"></i>
                        <h1 class="bebas text-4xl gold-glow" style="color: var(--gold);">BONNYSINO ADMIN</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="text-yellow-300">Admin: <span id="adminUserDisplay">-</span></span>
                        <button id="logoutBtn" class="btn-danger px-4 py-2 rounded-lg">
                            <i class="fas fa-sign-out-alt mr-2"></i>Logout
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Dashboard -->
        <main class="container mx-auto px-6 py-8">
            <!-- Statistics Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="stat-card p-6 text-center">
                    <i class="fas fa-users text-3xl text-yellow-400 mb-3"></i>
                    <h3 class="text-2xl font-bold text-yellow-400" id="totalUsers">0</h3>
                    <p class="text-gray-300">Total Users</p>
                </div>
                
                <div class="stat-card p-6 text-center">
                    <i class="fas fa-wallet text-3xl text-green-400 mb-3"></i>
                    <h3 class="text-2xl font-bold text-green-400" id="totalBalance">0 GHC</h3>
                    <p class="text-gray-300">Total Balance</p>
                </div>
                
                <div class="stat-card p-6 text-center">
                    <i class="fas fa-trophy text-3xl text-yellow-400 mb-3"></i>
                    <h3 class="text-2xl font-bold text-yellow-400" id="totalWins">0</h3>
                    <p class="text-gray-300">Total Wins</p>
                </div>
                
                <div class="stat-card p-6 text-center">
                    <i class="fas fa-dice text-3xl text-blue-400 mb-3"></i>
                    <h3 class="text-2xl font-bold text-blue-400" id="totalSpins">0</h3>
                    <p class="text-gray-300">Total Spins</p>
                </div>
            </div>

            <!-- Users Table -->
            <div class="card p-6 mb-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-yellow-400">Users Management</h2>
                    <button id="refreshUsersBtn" class="btn-gold px-4 py-2 rounded-lg">
                        <i class="fas fa-sync-alt mr-2"></i>Refresh
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="border-b border-yellow-400">
                                <th class="text-yellow-400 p-3">Username</th>
                                <th class="text-yellow-400 p-3">MoMo Number</th>
                                <th class="text-yellow-400 p-3">Balance</th>
                                <th class="text-yellow-400 p-3">Total Spins</th>
                                <th class="text-yellow-400 p-3">Total Wins</th>
                                <th class="text-yellow-400 p-3">Win Rate</th>
                                <th class="text-yellow-400 p-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Users will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="card p-6">
                <h2 class="text-2xl font-bold text-yellow-400 mb-6">Recent Activity</h2>
                <div id="recentActivity" class="space-y-3">
                    <!-- Activity will be populated here -->
                </div>
            </div>
        </main>
    </div>

    <!-- User Details Modal -->
    <div id="userDetailsModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="card p-8 max-w-2xl w-full mx-4 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-yellow-400">User Details</h2>
                <button id="closeUserDetailsModal" class="text-yellow-400 hover:text-yellow-300">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            
            <div id="userDetailsContent">
                <!-- User details will be populated here -->
            </div>
        </div>
    </div>

    <!-- Balance Adjustment Modal -->
    <div id="balanceModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="card p-8 max-w-md w-full mx-4">
            <h2 class="text-2xl font-bold text-yellow-400 mb-6">Adjust Balance</h2>
            
            <form id="balanceForm">
                <div class="mb-4">
                    <label class="block text-yellow-300 mb-2">User</label>
                    <input type="text" id="balanceUser" readonly
                           class="w-full px-4 py-3 bg-gray-800 border border-yellow-400 rounded-lg text-white">
                </div>
                
                <div class="mb-4">
                    <label class="block text-yellow-300 mb-2">Current Balance</label>
                    <input type="text" id="currentBalance" readonly
                           class="w-full px-4 py-3 bg-gray-800 border border-yellow-400 rounded-lg text-white">
                </div>
                
                <div class="mb-4">
                    <label class="block text-yellow-300 mb-2">Adjustment Type</label>
                    <select id="adjustmentType" class="w-full px-4 py-3 bg-black border border-yellow-400 rounded-lg text-white">
                        <option value="add">Add Funds</option>
                        <option value="subtract">Remove Funds</option>
                        <option value="set">Set Balance</option>
                    </select>
                </div>
                
                <div class="mb-6">
                    <label class="block text-yellow-300 mb-2">Amount (GHC)</label>
                    <input type="number" id="adjustmentAmount" required min="0" step="0.01"
                           class="w-full px-4 py-3 bg-black border border-yellow-400 rounded-lg text-white">
                </div>
                
                <div class="flex space-x-3">
                    <button type="submit" class="flex-1 btn-gold py-3 rounded-lg">
                        <i class="fas fa-check mr-2"></i>Confirm
                    </button>
                    <button type="button" id="cancelBalanceBtn" class="flex-1 bg-gray-600 text-white py-3 rounded-lg hover:bg-gray-700">
                        <i class="fas fa-times mr-2"></i>Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
